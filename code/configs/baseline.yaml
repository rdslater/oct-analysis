experiment_name: baseline

seed: 271828

data:
  batch_size: 8
  num_workers: 4
  train_files: ../local_data/train.json
  val_files: ../local_data/val.json

model:
  num_classes: 6
  lr: 0.001

trainer:
  max_epochs: 100
  accelerator: auto
  devices: 1

early_stopping:
  monitor: val_loss
  patience: 5
  mode: min
  min_delta: 0.0

checkpoint:
  filename: best
  monitor: val_loss
  mode: min
  save_top_k: 1
  save_last: true
